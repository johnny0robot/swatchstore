<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swatch Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Video Player Container */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 854px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      cursor: pointer;
    }

    /* Controls Overlay */
    .controls-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 60%, transparent);
      display: flex;
      flex-direction: column;
      padding: 0 12px 8px 12px;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
      z-index: 10;
    }

    /* Controls visibility */
    .video-container:hover .controls-container,
    .video-container.paused .controls-container,
    .video-container.controls-active .controls-container {
      opacity: 1;
    }

    /* Timeline / Scrubber Bar */
    .timeline-container {
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .timeline {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, #ff0000 var(--progress, 0%), rgba(255, 255, 255, 0.3) var(--progress, 0%));
      border-radius: 2px;
      outline: none;
      transition: height 0.1s ease;
      cursor: pointer;
    }

    .timeline-container:hover .timeline {
      height: 5px;
    }

    .timeline::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .timeline-container:hover .timeline::-webkit-slider-thumb {
      opacity: 1;
    }

    .timeline::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff0000;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .timeline-container:hover .timeline::-moz-range-thumb {
      opacity: 1;
    }

    /* Control Buttons Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
    }

    .controls-left,
    .controls-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Control Buttons Styling */
    .btn {
      background: none;
      border: none;
      color: #eee;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Volume Slider (Expands on hover) */
    .volume-container {
      display: flex;
      align-items: center;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 0;
      height: 3px;
      background: linear-gradient(to right, #fff var(--vol-progress, 100%), rgba(255, 255, 255, 0.3) var(--vol-progress, 100%));
      border-radius: 2px;
      outline: none;
      opacity: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .volume-container:hover .volume-slider,
    .volume-slider:focus {
      width: 60px;
      opacity: 1;
      margin-left: 6px;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }

    /* Time Display */
    .time-display {
      font-size: 13px;
      color: #ddd;
      margin-left: 8px;
      letter-spacing: 0.5px;
    }

    /* Icon Toggles */
    .icon-pause,
    .icon-volume-mute,
    .icon-fullscreen-exit {
      display: none;
    }

    .video-container.paused .icon-play { display: block; }
    .video-container.paused .icon-pause { display: none; }
    .video-container:not(.paused) .icon-play { display: none; }
    .video-container:not(.paused) .icon-pause { display: block; }

    .video-container.muted .icon-volume-high { display: none; }
    .video-container.muted .icon-volume-mute { display: block; }

    .video-container:fullscreen {
      max-width: none;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }

    .video-container:fullscreen .icon-fullscreen-enter { display: none; }
    .video-container:fullscreen .icon-fullscreen-exit { display: block; }

    /* Selector Menu Styling */
    #selecter {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background-color: #1a1a1a;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    #selecter:fullscreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #0f0f0f;
    }

    #selecter p {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #selecter button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #ff0000;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
      max-width: 250px;
    }

    #selecter button:hover:not(.notallowed) {
      background-color: #cc0000;
      transform: translateY(-2px);
    }

    /* Fixed Invalid CSS Property name */
    .notallowed {
      background-color: #555555 !important;
      color: #aaaaaa !important;
      border: none;
      border-radius: 8px;
      cursor: not-allowed; /* Fixed: pointer: not-allowed -> cursor: not-allowed */
      opacity: 0.6;
    }

    .dailog {
      background-color: black;
      color: white;
      border: 6px solid purple;
      padding: 20px;
    }

    .div {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background-color: #1a1a1a;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-container paused" id="videoContainer">
    <video id="video">
      <source src="https://raw.githubusercontent.com/johnny0robot/swatchstore/refs/heads/main/%241.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="controls-container">
      <!-- Red YouTube Timeline -->
      <div class="timeline-container">
        <input type="range" class="timeline" id="progressBar" min="0" max="100" value="0" step="0.1">
      </div>

      <!-- Control Bar -->
      <div class="controls-bar">
        <div class="controls-left">
          <!-- Play / Pause -->
          <button class="btn" id="playBtn" title="Play (k)">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- Volume Controls -->
          <div class="volume-container">
            <button class="btn" id="volumeBtn" title="Mute (m)">
              <svg class="icon-volume-high" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg class="icon-volume-mute" viewBox="0 0 24 24"><path d="M3.88 3.88a.996.996 0 000 1.41l3.5 3.5H3v6h4l5 5V13.33l4.22 4.22c-.67.42-1.42.75-2.22.95v2.06c1.38-.3 2.63-.94 3.69-1.81l1.6 1.6a.996.996 0 101.41-1.41L5.29 3.88a.996.996 0 00-1.41 0zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
          </div>

          <!-- Time Display -->
          <div class="time-display">
            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls-right">
          <!-- Fullscreen Toggle -->
          <button class="btn" id="fullscreenBtn" title="Full screen (f)">
            <svg class="icon-fullscreen-enter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg class="icon-fullscreen-exit" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="selecter"></div>

  <script>
    const selecter = document.getElementById("selecter");
    const container = document.getElementById("videoContainer");
    const video = document.getElementById("video");
    const playBtn = document.getElementById("playBtn");
    const progressBar = document.getElementById("progressBar");
    const volumeBtn = document.getElementById("volumeBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const currentTimeElem = document.getElementById("currentTime");
    const durationElem = document.getElementById("duration");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    // Helper: Format seconds to M:SS or H:MM:SS
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const s = Math.floor(seconds % 60);
      const m = Math.floor((seconds / 60) % 60);
      const h = Math.floor(seconds / 3600);

      const formattedSec = s < 10 ? `0${s}` : `${s}`;
      if (h > 0) {
        const formattedMin = m < 10 ? `0${m}` : `${m}`;
        return `${h}:${formattedMin}:${formattedSec}`;
      }
      return `${m}:${formattedSec}`;
    }

    // Play/Pause
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener("play", () => container.classList.remove("paused"));
    video.addEventListener("pause", () => container.classList.add("paused"));
    playBtn.addEventListener("click", togglePlay);
    video.addEventListener("click", togglePlay);

    // Timeline Update & Seek
    video.addEventListener("loadedmetadata", () => {
      durationElem.textContent = formatTime(video.duration);
    });

    video.addEventListener("timeupdate", () => {
      currentTimeElem.textContent = formatTime(video.currentTime);
      const progressPercent = (video.currentTime / video.duration) * 100 || 0;
      progressBar.value = progressPercent;
      progressBar.style.setProperty("--progress", `${progressPercent}%`);
    });

    progressBar.addEventListener("input", () => {
      const seekTime = (progressBar.value / 100) * video.duration;
      video.currentTime = seekTime;
      progressBar.style.setProperty("--progress", `${progressBar.value}%`);
    });

    // Volume & Mute Controls
    let lastVolume = 1;

    function updateVolume(value) {
      video.volume = value;
      video.muted = value === 0;
      container.classList.toggle("muted", video.muted);
      volumeSlider.style.setProperty("--vol-progress", `${value * 100}%`);
    }

    volumeSlider.addEventListener("input", (e) => {
      updateVolume(parseFloat(e.target.value));
      if (parseFloat(e.target.value) > 0) {
        lastVolume = parseFloat(e.target.value);
      }
    });

    volumeBtn.addEventListener("click", () => {
      if (video.muted || video.volume === 0) {
        const restoreVol = lastVolume > 0 ? lastVolume : 1;
        updateVolume(restoreVol);
        volumeSlider.value = restoreVol;
      } else {
        lastVolume = video.volume;
        updateVolume(0);
        volumeSlider.value = 0;
      }
    });

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen().catch(err => console.error(err));
      }
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    // Keyboard Shortcuts (Space/K for Play, F for Fullscreen, M for Mute)
    document.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "INPUT") return;

      if (e.key === " " || e.key.toLowerCase() === "k") {
        e.preventDefault();
        togglePlay();
      } else if (e.key.toLowerCase() === "f") {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key.toLowerCase() === "m") {
        e.preventDefault();
        volumeBtn.click();
      }
    });

    // Auto-hide controls when idle over video
    let controlsTimeout;
    container.addEventListener("mousemove", () => {
      container.classList.add("controls-active");
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(() => {
        if (!video.paused) {
          container.classList.remove("controls-active");
        }
      }, 2500);
    });

    container.addEventListener("mouseleave", () => {
      if (!video.paused) {
        container.classList.remove("controls-active");
      }
    });

    // Game Functions (Added missing click handlers)
    function modernShop(swatches) {
      selecter.innerHTML = `
        <p>${swatches} Swatches</p>
        <div class="div">
          <div class="card">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" zoomAndPan="magnify" viewBox="0 0 216 143.999998" height="288" preserveAspectRatio="xMidYMid meet" version="1.0"><rect x="-21.6" width="259.2" fill="#ffffff" y="-14.4" height="172.799997" fill-opacity="1"/><rect x="-21.6" width="259.2" fill="#000000" y="-14.4" height="172.799997" fill-opacity="1"/></svg>
          </div>
        </div>
      `;
    }

    function myShop() {
      alert("Opening My Shop...");
    }

    function gameStart() {
      selecter.innerHTML = `
        <p id="swatches">3 Swatches</p>
        <button onclick="modernShop(3)">Modern Shop</button>
        <button class="notallowed" disabled>Dark Modern</button>
        <button class="notallowed" disabled>Coastal Shop</button>
        <button onclick="myShop()">My Shop</button>
      `;  
    }
    
    // Transition to Selector Fullscreen on Video End
    video.addEventListener("ended", () => {
      game();
      if (document.fullscreenElement) {
        document.exitFullscreen().then(() => {
          selecter.requestFullscreen().catch(err => console.error("Selector fullscreen failed:", err));
        }).catch(err => console.error(err));
      } else {
        selecter.requestFullscreen().catch(err => console.error("Selector fullscreen failed:", err));
      }
    });
  </script>
</body>
</html>
