<!doctype html>
<html lang="en">
  <head>
    <title>Swatch Store</title>
    <style>
      .time {
        background-color: green;
      }

      button {
        background-color: blue;
        color: white;
        border: none
        border-radius: 8px;
      }

      button:hover {
        background-color: darkblue;
      }
    </style>
  </head>
  <body>
    <div id="video2">
      <video width="640" id="video">
        <source src="https://raw.githubusercontent.com/johnny0robot/swatchstore/refs/heads/main/%241.mp4" type="video/mp4">
      </video>
      <input type="range" class="time" id="progressBar" value="0" min="0" step="0.1">
      <button onclick="play()" id="playBtn">Play</button>
      <button onclick="fullscreen()"></button>
    </div>

    <script>
      const video2 = document.getElementById("video"); 
      const video = document.getElementById("video");
      const progressBar = document.getElementById("progressBar");
      const playBtn = document.getElementById("playBtn");
      function play() {
        if (video.paused) {
          video.play();
          playBtn.textContent = "Pause";
        } else {
          video.pause;
          playBtn.textContent = "Play";
        }
      }

      video.addEventListener("loadedmetadata", () => {
        progressBar.max = video.duration;  
      });
      
      video.addEventListener("timeupdate", () => {
        progressBar.value = video.currentTime;  
      });

      progressBar.addEventListener("input", () => {
        video.cureentTime = progressBar.input;
      });

      function fullscreen() {
        if (video.requestFullscreen) {
          video2.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();   
        }
      }
    </script>
  </body>
</html>
